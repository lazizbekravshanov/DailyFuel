name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements*.txt

      - name: Install Python packages
        run: python -m pip install -r scripts/requirements-dev.txt

      - name: Python tests
        run: python -m pytest

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install npm packages
        run: npm ci

      - name: Site tests
        run: npm test

      - name: Build against data/ (EIA only mode)
        run: npm run build

      - name: Write synthetic AAA mode data
        run: python scripts/make_fixtures.py

      - name: Build against synthetic AAA mode data
        env:
          DAILYFUEL_DATA_DIR: tmp/fixture-data
        run: npm run build
